<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Silent Check SSO</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener('message', (event) => {
        if (event.data === 'keycloak') {
          window.parent.postMessage(event.data, event.origin);
        }
      });
    </script>
  </body>
</html>
